[build-system]
requires = ["hatchling", "openapi-python-client>=0.21"]
build-backend = "hatchling.build"

[project]
name = "gridx-connector"
version = "3.0.4"
description = "Connector for GridX to fetch live and historical data from your Photovoltaic System"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["gridx", "photovoltaic", "solar", "energy", "eon-home", "viessmann"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "requests>=2.31",
    "authlib>=1.3",
    "httpx>=0.27",
    "attrs>=23.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "openapi-python-client>=0.21",
    "bump-my-version>=0.23",
]

# PEP 735 dependency groups — used by `uv sync` (dev deps included by default)
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "openapi-python-client>=0.21",
    "bump-my-version>=0.23",
]

[project.scripts]
gridx = "gridx_connector.cli:main"

[project.urls]
Homepage = "https://github.com/unl0ck/gridx-connector"
Repository = "https://github.com/unl0ck/gridx-connector"
Issues = "https://github.com/unl0ck/gridx-connector/issues"

# gridx_connector_api/ is generated (gitignored), so it must be declared as
# build artifacts — hatchling silently drops gitignored files otherwise.
[tool.hatch.build]
artifacts = ["gridx_connector_api/"]

[tool.hatch.build.targets.wheel]
packages = ["gridx_connector", "gridx_connector_api"]
include = [
    "gridx_connector/py.typed",
    "gridx_connector_api/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "gridx_connector/**",
    "gridx_connector_api/**",
    "APIDefinition/openapi.json",
    "APIDefinition/openapi-client-config.yml",
    "scripts/generate_client.sh",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.bumpversion]
current_version = "3.0.4"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
