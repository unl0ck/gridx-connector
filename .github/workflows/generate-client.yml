name: Regenerate API Client

on:
  push:
    paths:
      - "APIDefinition/openapi.json"
      - "APIDefinition/openapi-client-config.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate gridx_connector_api
        run: bash scripts/generate_client.sh

      - name: Run tests
        run: uv run pytest tests/ -v
