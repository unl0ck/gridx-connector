# This workflow uploads a Python Package to PyPI when a release is created.
# Uses OIDC Trusted Publishing — no API token needed.
# Set up Trusted Publishing on PyPI: https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gridx-connector

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Generate gridx_connector_api
        run: |
          uv sync --dev
          bash scripts/generate_client.sh

      - name: Run tests
        run: |
          uv run pytest tests/ -v \
            --cov=gridx_connector \
            --cov-report=term-missing \
            --cov-report=markdown:coverage.md

      - name: Write coverage summary
        if: always()
        run: cat coverage.md >> $GITHUB_STEP_SUMMARY

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

